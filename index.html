<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Town by Town</title>
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1f3d2b">
<meta name="robots" content="noindex, nofollow">
<style>
  :root{
    --ink:#24312a; --paper:#f7f2e7; --card:#fffdf7; --line:#d9cfb8;
    --green:#2e6b4f; --green-dark:#1f4d38; --gold:#c99a2e; --red:#b3402e;
    --sky:#7fb2d9; --muted:#6b7263;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0;}
  body{
    font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background:var(--paper); color:var(--ink); font-size:17px; line-height:1.45;
  }
  .wrap{max-width:560px; margin:0 auto; padding:14px 14px 30px;}
  header.top{display:flex; align-items:center; justify-content:space-between; gap:10px; margin:4px 0 10px;}
  h1{font-size:26px; margin:0; letter-spacing:.2px;}
  .badge{font-size:12px; font-weight:700; color:var(--green-dark); border:1.5px solid var(--green);
    border-radius:999px; padding:4px 10px; white-space:nowrap; background:#eef5ee;}
  .card{background:var(--card); border:1.5px solid var(--line); border-radius:16px; padding:14px; margin:0 0 12px;
    box-shadow:0 1px 2px rgba(36,49,42,.06);}
  .resources{display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px;}
  .res{background:var(--card); border:1.5px solid var(--line); border-radius:14px; padding:9px 10px;}
  .res .label{font-size:13px; font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing:.4px;}
  .res .value{font-size:22px; font-weight:800;}
  .bar{height:8px; border-radius:99px; background:#e9e2cf; margin-top:5px; overflow:hidden;}
  .bar > div{height:100%; border-radius:99px; background:var(--green);}
  .bar.low > div{background:var(--red);}
  h2{font-size:20px; margin:2px 0 8px;}
  h3{font-size:16px; margin:0 0 6px;}
  p{margin:0 0 9px;}
  .small{font-size:14px; color:var(--muted);}
  .town-note{font-size:15px;}
  svg.map{width:100%; height:auto; display:block;}
  .maplabel{font-size:11px; font-weight:700; fill:var(--ink);}
  .maplabel.dim{fill:var(--muted); font-weight:600;}
  button.choice{
    display:block; width:100%; text-align:left; min-height:56px; padding:12px 14px; margin:0 0 10px;
    font-size:17px; font-weight:700; color:var(--ink); background:#f2ead6; border:2px solid var(--green);
    border-radius:14px; cursor:pointer;
  }
  button.choice:active{transform:scale(.99);}
  button.choice .sub{display:block; font-size:14px; font-weight:500; color:var(--muted); margin-top:3px;}
  button.choice:disabled{opacity:.45; border-color:var(--line); cursor:default;}
  button.choice.primary{background:var(--green); color:#fff; border-color:var(--green-dark);}
  button.choice.primary .sub{color:#dcebe2;}
  button.plain{
    display:inline-block; min-height:52px; padding:10px 18px; font-size:16px; font-weight:700;
    background:transparent; color:var(--green-dark); border:2px solid var(--green); border-radius:12px; cursor:pointer;
  }
  .weather-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:8px; text-align:center; margin-top:8px;}
  .weather-grid .cell{background:#eef3f7; border-radius:10px; padding:8px 4px;}
  .weather-grid .cell .v{font-size:18px; font-weight:800;}
  .weather-grid .cell .k{font-size:12px; color:var(--muted); font-weight:700; text-transform:uppercase;}
  .eventbox{background:#fdf3d8; border:1.5px solid var(--gold); border-radius:12px; padding:11px 12px; margin:0 0 10px;}
  .eventbox.good{background:#e9f4ea; border-color:var(--green);}
  .log{list-style:none; margin:0; padding:0;}
  .log li{padding:7px 0; border-bottom:1px solid #eee5cf; font-size:15px;}
  .log li:last-child{border-bottom:none;}
  .result{text-align:center; padding:10px 4px;}
  .result .big{font-size:30px; font-weight:900; margin:4px 0 8px;}
  footer.site{margin-top:18px; text-align:center; font-size:13.5px; color:var(--muted);}
  .rowbtns{display:flex; gap:10px; flex-wrap:wrap; margin-top:6px;}
  .pulse{animation:pulse 1.6s ease-in-out infinite;}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
  /* The mix: postcard framing around richer town cards (Matthew, Oct 31, 2026). */
  body{background:#eadfc6; background-image:radial-gradient(#ddcda6 1px, transparent 1px); background-size:22px 22px;}
  h1, h2{font-family:Georgia, 'Times New Roman', serif;}
  .card{border:2px solid #c9b384;}
  .mapcard{position:relative; overflow:hidden;}
  .stampdeco{position:absolute; top:10px; right:10px; width:52px; height:62px; background:#f6e7c8; border:2px dashed #b3402e;
    border-radius:4px; text-align:center; font-size:9.5px; font-weight:800; color:#b3402e; padding-top:6px; z-index:2;}
  .stampdeco .big{font-size:20px; line-height:1.1;}
  .postmark{position:absolute; top:14px; right:52px; width:58px; height:58px; border:2px solid rgba(70,90,140,.4); border-radius:50%;
    color:rgba(70,90,140,.55); font-size:8px; font-weight:700; text-align:center; padding-top:15px; transform:rotate(-13deg); z-index:2;
    background:rgba(253,246,227,.35);}
  .townhead{background:linear-gradient(120deg,#2e6b4f,#4b7d43); color:#fff; border-radius:12px; padding:13px 14px; margin:-4px -4px 10px;}
  .townhead h2{margin:0; color:#fff;}
  .townhead p{margin:3px 0 0; font-size:13.5px; opacity:.93;}
  .chips{display:flex; gap:6px; flex-wrap:wrap; margin:0 0 10px;}
  .fchip{background:#eef3f7; border-radius:999px; padding:5px 10px; font-size:12.5px; font-weight:700; color:#33506b;}
  .fchip.wx{background:#fdf3d8; color:#8a5a14;}
  button.act{display:flex; gap:11px; align-items:flex-start; background:#fbf8ef;}
  button.act .ic{font-size:24px; line-height:1.25;}
  button.act .tx{flex:1;}
  button.act .tag{margin-left:auto; text-align:right; font-weight:800; font-size:14.5px; color:var(--green-dark); white-space:nowrap;}
  button.act .tag span{display:block; font-weight:600; font-size:12.5px; color:var(--muted);}
  button.act.primary{background:var(--green);}
  button.act.primary .tag, button.act.primary .tag span{color:#dcebe2;}
  .tipbox{background:#e9f4ea; border-radius:10px; padding:9px 11px; font-size:13.5px; margin-top:2px;}
  .wxnote{background:#fffbe8; border:1.5px solid #d8c48f; border-radius:8px; padding:10px 12px; transform:rotate(-.5deg);
    box-shadow:0 2px 6px rgba(90,70,30,.15); margin:0 0 6px;}
  .album{display:grid; grid-template-columns:repeat(3,1fr); gap:8px;}
  .pcard{border-radius:8px; padding:8px 9px; min-height:74px; position:relative;}
  .pcard.got{background:#fdf6e3; border:2px solid #c9b384; box-shadow:0 1px 3px rgba(90,70,30,.18);}
  .pcard.miss{border:1.5px dashed #c9b384; opacity:.5;}
  .pcard .nm{font-family:Georgia,'Times New Roman',serif; font-weight:800; font-size:13.5px; line-height:1.2;}
  .pcard .tg{font-size:10.5px; color:var(--muted); margin-top:2px; line-height:1.25;}
  .pcard .when{font-size:10px; font-weight:800; color:#b3402e; letter-spacing:.4px; text-transform:uppercase;}
  .pcard svg.scene{width:100%; height:auto; display:block; border-radius:5px; margin-bottom:5px;}
  .stampdot{display:inline-block; width:11px; height:11px; border:2px solid rgba(179,64,46,.75); border-radius:50%; margin:3px 3px 0 0;}
  .setrow{display:flex; align-items:center; gap:10px; margin:10px 0;}
  .setrow label{flex:0 0 118px; font-weight:700; font-size:15px;}
  .setrow input[type=range]{flex:1; min-height:44px; accent-color:var(--green);}
  .setrow .pct{flex:0 0 44px; text-align:right; font-weight:800;}
  .fldlabel{font-weight:800; font-size:13px; letter-spacing:.5px; text-transform:uppercase; color:var(--muted); margin:12px 0 4px;}
  .txtin{width:100%; min-height:52px; font-size:17px; padding:10px 12px; border:2px solid var(--line); border-radius:12px; background:#fff; color:var(--ink);}
  .chiprow{display:flex; gap:8px; flex-wrap:wrap; margin:4px 0 6px;}
  button.choice.compact{min-height:52px; padding:8px 12px; font-size:16px; margin-bottom:8px;}
  button.choice.compact .sub{font-size:13px; margin-top:2px;}
  .toolbar{display:flex; gap:8px; flex-wrap:wrap; margin-top:10px;}
  .toolbar .plain{flex:1 1 0; min-height:50px; padding:8px 4px; font-size:15px; white-space:nowrap;}
  .ovl{position:fixed; inset:0; background:rgba(31,41,34,.48); z-index:60; display:flex; align-items:flex-end; justify-content:center;}
  .ovpanel{background:var(--card); width:100%; max-width:580px; max-height:92vh; overflow-y:auto; border-radius:18px 18px 0 0; padding:14px 14px 22px; box-shadow:0 -8px 34px rgba(0,0,0,.28);}
  .ovhead{display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:8px;}
  .ovhead h3{font-size:18px; margin:0;}
  .ovpanel .card{border:none; box-shadow:none; padding:0; margin:0; background:transparent;}
  .chipbtn.sm{min-height:40px; padding:5px 10px; font-size:14.5px;}
  .card.tight{padding:12px;}
  .card.tight .fldlabel{margin-top:8px;}
  .card.tight p{margin-bottom:6px;}
  .card.tight .chiprow{gap:6px;}
  .card.tight .txtin{min-height:46px; padding:8px 12px;}
  .card.tight .plain{min-height:46px;}
  .idgrid{display:flex; gap:10px;}
  .idgrid > div{flex:1; min-width:0;}
  @media (max-width:560px){ .card.tight{padding:11px;} .card.tight .fldlabel{margin-top:7px;} }
  .petrow{display:flex; gap:8px; margin-bottom:6px;}
  .pettile{flex:1; min-height:62px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; font-size:15px; font-weight:700; color:var(--ink); background:#f2ead6; border:2px solid var(--green); border-radius:12px; cursor:pointer; padding:6px 4px;}
  .pettile .pic{font-size:23px; line-height:1.1;}
  .pettile.sel{background:var(--green); color:#fff; border-color:var(--green-dark);}
  @media (max-width:380px){
    body{margin:4px;}
    .wrap{padding:10px 10px 20px;}
    .top{margin-bottom:8px;}
    h1{font-size:23px;}
    h2{margin-bottom:5px;}
    .card{padding:10px;}
    .card p{font-size:15px;}
    .card p.small{font-size:12.5px;}
    .fldlabel{font-size:12px;}
    .chipbtn.sm{min-height:34px; padding:4px 8px; font-size:14px;}
    .card.tight{padding:9px;}
    .card.tight .fldlabel{margin-top:4px;}
    .card.tight .txtin{min-height:40px;}
    .card.tight .choice.compact{margin-bottom:4px;}
    .petrow .pettile{min-height:50px;}
    .top{margin-bottom:6px;}
    .wrap{padding:8px 10px 12px;}
    .petrow .pettile{min-height:54px;}
    .pettile .pic{font-size:20px;}
    .card.tight .txtin{min-height:42px; padding:7px 10px;}
    button.choice.compact{padding:6px 10px;}
    button.choice.compact .sub{font-size:12.5px;}
    .toolbar{margin-top:6px;}
    .toolbar .plain{min-height:46px; font-size:14px;}
    footer.site{margin-top:12px; font-size:12.5px;}
  }
  .chipbtn{min-height:48px; padding:9px 16px; font-size:16px; font-weight:700; background:#f2ead6; color:var(--ink); border:2px solid var(--green); border-radius:999px; cursor:pointer;}
  .chipbtn.sel{background:var(--green); color:#fff; border-color:var(--green-dark);}
  .choice.sel{border-color:var(--green-dark); background:#eef3df;}
  .visits{font-size:10.5px; color:#b3402e; font-weight:700; margin-top:2px;}
</style>
</head>

<div class="wrap">

    <h1>Town by Town</h1>
    <span class="badge">Private prototype</span>

  <div id="app"></div>

</div>

   (Matthew, Oct 31, 2026: both). Real weather via Open-Meteo (free,
   no key), shown before the transport choice, with a seeded fallback
   when the network or the service is unavailable. */
</script>

function mapSVG(){
  const W = 360, H = 300, pad = 34;
  const lons = TOWNS.map(t => t.lon), lats = TOWNS.map(t => t.lat);
  const minLon = Math.min(...lons) - 0.15, maxLon = Math.max(...lons) + 0.15;
  const minLat = Math.min(...lats) - 0.12, maxLat = Math.max(...lats) + 0.12;
  const px = t => pad + (t.lon - minLon) / (maxLon - minLon) * (W - pad * 2);
  const py = t => H - pad - (t.lat - minLat) / (maxLat - minLat) * (H - pad * 2);
  let s = '<svg class="map" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Stylized route map: " + routeMeta().name>';
  const pts = TOWNS.map(t => px(t).toFixed(1) + "," + py(t).toFixed(1)).join(" ");
  s += '<polyline points="' + pts + '" fill="none" stroke="#b9ac8d" stroke-width="3" stroke-dasharray="6 5"/>';
  if (state && state.leg > 0) {
    const done = TOWNS.slice(0, state.leg + 1).map(t => px(t).toFixed(1) + "," + py(t).toFixed(1)).join(" ");
    s += '<polyline points="' + done + '" fill="none" stroke="#2e6b4f" stroke-width="4"/>';
  }
  TOWNS.forEach((t, i) => {
    const cur = state && i === state.leg && state.phase !== "over";
    const doneT = state && i < state.leg;
    const fill = cur ? "#c99a2e" : doneT ? "#2e6b4f" : "#fffdf7";
    const stroke = cur ? "#8a6a14" : "#2e6b4f";
    s += '<circle cx="' + px(t) + '" cy="' + py(t) + '" r="' + (cur ? 9 : 6.5) + '" fill="' + fill + '" stroke="' + stroke + '" stroke-width="2.5" class="' + (cur ? "pulse" : "") + '"/>';
    let anchor = px(t) > W - 90 ? "end" : "start";
    let dx = anchor === "end" ? -11 : 11;
    let dy = 4;
    if (t.name === "Lebanon") { anchor = "start"; dx = 11; dy = -10; }
    if (t.name === "White River Junction") { anchor = "end"; dx = -11; dy = 16; }
    if (t.name === "Lowell") { anchor = "end"; dx = -11; dy = 4; }
    s += '<text class="maplabel' + (doneT || cur ? "" : " dim") + '" x="' + (px(t) + dx) + '" y="' + (py(t) + dy) + '" text-anchor="' + anchor + '">' + t.name + "</text>";
  });
  s += "</svg>";
  return s;
}

function albumHTML(routeId, withCritters){
  const rid = routeId || "bb";
  const routeTowns = ROUTES[rid].towns;
  const visits = album.visits || {};
  const vcount = t => visits[rid + ":" + t.name] || 0;
  const townsGot = routeTowns.filter(t => vcount(t) > 0).length;
  const totalVisits = routeTowns.reduce((a, t) => a + vcount(t), 0);
  let tiles = "";
  routeTowns.forEach((t, i) => {
    const count = vcount(t);
    const has = count > 0;
    const extra = TOWN_EXTRA[t.name] || { tag:"" };
    const shortTag = extra.tag.split("·")[0].trim();
    let stamps = "";
    if (has) {
      const dots = Math.min(count, 6);
      for (let d = 0; d < dots; d++) stamps += '<span class="stampdot"></span>';
      stamps = '<div>' + stamps + '</div><div class="visits">' + (count === 1 ? "Visited once" : "Visited " + count + " times") + "</div>";
    }
    tiles += '<div class="pcard ' + (has ? "got" : "miss") + '">' + (has ? (SCENE_BY_NAME[t.name] || "") : "") + '<div class="when">Stop ' + (i + 1) + '</div>' +
      '<div class="nm">' + (has ? t.name + ", " + t.state : t.name) + '</div>' +
      '<div class="tg">' + (has ? shortTag : "Not yet collected") + "</div>" + stamps + "</div>";
  });
  const crits = album.critters || {};
  const critList = CRITTERS.filter(c => (crits[c.id] || 0) > 0);
  const critHTML = (withCritters && critList.length) ? '<p class="small" style="margin-top:10px"><b>Field friends collected:</b> ' + critList.map(c => c.icon + " " + c.name + " the " + c.species + (crits[c.id] > 1 ? " (met " + crits[c.id] + " times)" : "")).join(" · ") + "</p>" : "";
  return '<div class="card"><h3>Postcard album · ' + ROUTES[rid].name + ' · ' + townsGot + ' of ' + routeTowns.length + ' towns · ' + totalVisits + ' visits</h3>' +
    '<div class="album">' + tiles + "</div>" + critHTML +
    '<p class="small" style="margin-top:8px">Your album is kept for good, across every trip. Revisiting a town adds another stamp to its postcard.</p></div>';
}

      '<button class="plain" data-action="ov-album">📬 Postcards</button>' +
      '<button class="plain" data-action="ov-settings">⚙️ Settings</button>' +
      "</div></div>" +
      overlayHTML();
    return;
  }
  let h = "";
  if (state.phase !== "setup") {
    if (state.traveler) h += '<p class="small" style="margin:0 0 8px">🧳 <b>' + esc(state.traveler.name) + "</b> · " + esc(state.traveler.pronouns) + (petProfile() ? " · traveling with " + petName() + " the " + petProfile().kind : "") + "</p>";
    h += resourcesHTML();
    h += '<div class="card mapcard"><div class="stampdeco"><div class="big">⛰️</div>' + TOWNS[TOWNS.length - 1].state + '<br>USA</div>' +
      '<div class="postmark">' + TOWNS[state.leg].state + ' MAIL<br>OCT 31</div>' + mapSVG() +
      '<p class="small" style="margin-top:6px">Leg ' + Math.min(state.legsDone + 1, legsTotal()) + ' of ' + legsTotal() + '. Traveled ' + state.legsDone + ' of ' + legsTotal() + ' legs. Jobs done: ' + state.jobsDone + ". Visits: " + state.visitsDone + ".</p></div>";
  }
  if (state.phase === "setup") {
    const chip = (kind, val, label) => '<button class="chipbtn sm' + (draft[kind] === val ? " sel" : "") + '" data-chip="' + kind + '" data-value="' + val + '">' + label + "</button>";
    const petDetail = draft.pet === "dog" ? "More heart, more costs. Morale +3/leg, visits +3. $3/leg food and supplies, rest $13. Muddy paws happen."
      : draft.pet === "cat" ? "Calmer, lower costs. Morale +2/leg, visits +2, rest +30 energy. $2/leg food and litter, rest $12. Carrier escapes happen."
      : draft.pet === "none" ? "Leaner, cheaper, quieter. Just you and the road."
      : "Solo either way. A pet changes the math of the whole trip.";
    h += '<div class="card tight"><h2>Who is traveling? <span style="font-size:13px; font-style:italic; color:#7a6748">· yours to set, remembered next time</span></h2>' +
      (state.setupError ? '<div class="eventbox"><b>One moment:</b> ' + state.setupError + "</div>" : "") +
      '<div class="fldlabel">Your name</div>' +
      '<input class="txtin" id="traveler-name" type="text" maxlength="30" placeholder="Traveler" value="' + esc(draft.name) + '">' +
      '<div class="idgrid"><div><div class="fldlabel">Gender</div><div class="chiprow">' +
      chip("gender", "Woman", "Woman") + chip("gender", "Man", "Man") + chip("gender", "Nonbinary", "Nonbinary") + chip("gender", "custom", "My own words") + "</div>" +
      (draft.gender === "custom" ? '<input class="txtin" id="traveler-gender-custom" type="text" maxlength="30" placeholder="Describe your gender" value="' + esc(draft.genderCustom) + '">' : "") +
      '</div><div><div class="fldlabel">Pronouns</div><div class="chiprow">' +
      chip("pronouns", "she/her", "she/her") + chip("pronouns", "he/him", "he/him") + chip("pronouns", "they/them", "they/them") + chip("pronouns", "custom", "My own words") + "</div>" +
      (draft.pronouns === "custom" ? '<input class="txtin" id="traveler-pronouns-custom" type="text" maxlength="30" placeholder="Your pronouns" value="' + esc(draft.pronounsCustom) + '">' : "") +
      '</div></div>' +
      '<div class="fldlabel" style="margin-top:10px">And who else?</div>' +
      '<div class="petrow">' +
      '<button class="pettile' + (draft.pet === "dog" ? " sel" : "") + '" data-petpick="dog"><span class="pic">🐕</span>Dog</button>' +
      '<button class="pettile' + (draft.pet === "cat" ? " sel" : "") + '" data-petpick="cat"><span class="pic">🐈</span>Cat</button>' +
      '<button class="pettile' + (draft.pet === "none" ? " sel" : "") + '" data-petpick="none"><span class="pic">🧭</span>No pet</button>' +
      "</div>" +
      '<p class="small">' + petDetail + "</p>" +
      (draft.pet === "dog" || draft.pet === "cat" ? '<div class="fldlabel">Name your ' + draft.pet + '</div>' +
        '<div style="display:flex; gap:8px; align-items:stretch"><input class="txtin" id="pet-name" type="text" maxlength="24" value="' + esc(draft.petName) + '" style="flex:1">' +
        '<button class="plain" data-action="reroll-pet-name">🎲 Reroll</button></div>' +
        '<p class="small">Rolled for you: keep, reroll, or type your own.</p>' : "") +
      '<button class="choice compact primary" data-action="start-trip">Start the trip<span class="sub">From ' + TOWNS[0].name + ' to ' + finishName() + ', with $' + routeMeta().startMoney + '.</span></button></div>';
  } else if (state.phase === "over") {
    const won = state.result === "win";
    h += '<div class="card result"><div class="big">' + (won ? "You made it to " + finishName() + "." : "The trip ends here.") + "</div>" +
      (won ? '<div class="wxnote" style="text-align:left">📬 <b>A postcard home:</b> ' + winNoteFor() + ' Signed, ' + esc(state.traveler ? state.traveler.name : "Traveler") + '.</div>' : "") +
      (won && state.traveler ? "<p><b>Well done, " + esc(state.traveler.name) + ".</b></p>" : "") +
      "<p>" + state.reason + "</p>" +
      '<p class="small">Legs traveled: ' + state.legsDone + " of " + legsTotal() + ". Jobs done: " + state.jobsDone + ". Visits made: " + state.visitsDone + ". Postcards: " + (state.postcards ? state.postcards.length : 0) + " of " + TOWNS.length + (won && state.postcards && state.postcards.length === TOWNS.length ? ". Album complete." : ".") + "</p>" +
      (state.friends && state.friends.length ? '<p class="small">Field friends who rode along: ' + state.friends.map(id => { const cc = critterById(id); return cc ? cc.icon + " " + cc.name + " the " + cc.species : id; }).join(", ") + ". They head home from here, with stories.</p>" : "") +
      (won && chainNextFor(state) ? '<button class="choice primary" data-action="continue-chain">Continue the journey<span class="sub">' + chainNextFor(state).label + '. Same traveler, same pet, fresh resources.</span></button>' : "") +
      '<button class="choice' + (won && chainNextFor(state) ? "" : " primary") + '" data-action="new-run">Start a new trip<span class="sub">A fresh start on this route, with a new day of weather.</span></button></div>';
  } else if (state.phase === "encounter") {
    const c = state.encounter;
    const town = TOWNS[state.leg];
    const extra = TOWN_EXTRA[town.name];
    h += '<div class="card"><div class="townhead"><div><div class="small" style="letter-spacing:1px; font-weight:700">A FIELD FRIEND NEAR ' + town.name.toUpperCase() + '</div><h3 style="margin:2px 0">' + c.icon + " " + c.name + " the " + c.species + '</h3><div class="small">' + extra.tag + '</div></div></div>' +
      '<div class="factline"><span class="chip">🐾 Collectible</span><span class="chip">Lifetime collection</span></div>' +
      '<p>' + c.text + '</p><p>It seems to have decided that <b>' + esc(travelerName()) + '</b> is good company.</p>' +
      '<button class="choice act" data-action="friend-befriend"><span class="ic">' + c.icon + '</span><span class="tx">Befriend ' + c.name + '<span class="sub">' + c.bonusText + ' While along, field friends add +1 morale per leg (up to +2).</span></span><span class="tag">Collect<span>rides along</span></span></button>' +
      '<button class="choice act" data-action="friend-leave"><span class="ic">👋</span><span class="tx">Wave and let them be<span class="sub">A shared snack and a proper goodbye. They stay wild, you stay kind.</span></span><span class="tag">Morale +1<span>no collection</span></span></button></div>';
  } else if (state.phase === "mission") {
    const town = TOWNS[state.leg];
    const extra = TOWN_EXTRA[town.name] || { tag:"", tip:"" };
    const next = TOWNS[state.leg + 1];
    h += '<div class="card"><div class="townhead"><h2>Welcome to ' + town.name + ", " + town.state + '</h2><p>' + extra.tag + '</p></div>' +
      '<div class="chips"><span class="fchip">Leg ' + state.legsDone + ' of ' + legsTotal() + ' done</span>' +
      '<span class="fchip">Next: ' + next.name + ", " + next.dist + ' mi</span>' +
      '<span class="fchip">' + (town.bus ? "Bus runs from here" : "No bus from here") + '</span></div>' +
      '<p class="town-note">' + town.note + "</p>";
    if (state.justCollected === state.leg) {
      if ((state.lastVisitCount || 1) > 1) h += '<div class="wxnote">📬 <b>Postcard stamped again:</b> this is visit ' + state.lastVisitCount + " to " + town.name + ". Its postcard in your album carries another stamp now.</div>";
      else h += '<div class="wxnote">📬 <b>New postcard collected:</b> ' + town.name + ", " + town.state + ". It is in your album below, and it stays there for good.</div>";
    }
    if (state.companionFarewell) h += '<div class="eventbox good"><b>Farewell:</b> ' + state.companionFarewell + "</div>";
    if (state.lastEvent) h += '<div class="eventbox' + (state.lastEvent.good ? " good" : "") + '"><b>On the road:</b> ' + state.lastEvent.text + "</div>";
    h += "<p><b>Stay a while, or press on?</b> The next leg leaves from here whenever you are ready.</p>";
    if (town.job) h += '<button class="choice act" data-action="mission-job"><span class="ic">💼</span><span class="tx">' + town.job.title + '<span class="sub">Work here in ' + town.name + '. Your call, no pressure.</span></span><span class="tag">+$' + town.job.pay + "<span>energy " + town.job.energy + "</span></span></button>";
    if (town.visit) h += '<button class="choice act" data-action="mission-visit"><span class="ic">🤝</span><span class="tx">' + town.visit.title + '<span class="sub">A friendly stop in ' + town.name + '.</span></span><span class="tag">Morale +' + (town.visit.morale + (petProfile() ? petProfile().moraleVisit : 0)) + "<span>" + (town.visit.cost ? "$" + town.visit.cost + " · " : "Free · ") + "energy " + town.visit.energy + "</span></span></button>";
    const offer = companionFor(state.seed, state.leg);
    if (offer) h += '<button class="choice act" data-action="mission-companion" ' + (state.money - 5 <= 0 ? "disabled" : "") + '><span class="ic">🧳</span><span class="tx">Ride along: ' + offer.name + ", " + offer.desc + '<span class="sub">' + offer.offer + ' Cover their meal ($5). One leg only, and not on a bicycle.</span></span><span class="tag">$5<span>one leg</span></span></button>';
    const restCost = petProfile() ? petProfile().restCost : 10;
    const restEnergy = petProfile() ? petProfile().restEnergy : 26;
    h += '<button class="choice act" data-action="mission-rest" ' + (state.money - restCost <= 0 ? "disabled" : "") + '><span class="ic">🛏️</span><span class="tx">Rest, eat well, and sleep<span class="sub">A real meal and a quiet ' + (state.pet ? "pet-friendly " : "") + 'room in ' + town.name + '.</span></span><span class="tag">Energy +' + restEnergy + '<span>$' + restCost + ' · morale +6</span></span></button>';
    h += '<button class="choice act" data-action="mission-continue"><span class="ic">🧭</span><span class="tx">Press on now<span class="sub">No stop, no cost. On to the next leg.</span></span><span class="tag">Free<span>leave now</span></span></button>';
    if (extra.tip) h += '<div class="tipbox">💡 <b>Local tip:</b> ' + extra.tip + "</div>";
    h += "</div>";
  } else if (state.phase === "plan") {
    const from = TOWNS[state.leg], dest = TOWNS[state.leg + 1];
    h += '<div class="card"><h2>' + from.name + " to " + dest.name + "</h2>" +
      '<p class="small">' + dest.dist + ' miles. First, the weather waiting for you in ' + dest.name + ":</p>";
    if (weatherLoading || !state.weather) {
      h += '<p><b>Checking live weather for ' + dest.name + "...</b></p>";
    } else {
      const w = state.weather;
      h += '<div class="wxnote"><div style="font-size:19px"><b>' + (WEATHER_ICON[w.category] || "") + " " + w.label + '</b> <span class="small">(' + (w.source === "live" ? "live from Open-Meteo" : "offline forecast, saved for this run") + ")</span></div>" +
        '<div class="small">Weather report from ' + dest.name + ', written before you choose. That order is the game.</div></div>' +
        '<div class="weather-grid">' +
        '<div class="cell"><div class="v">' + w.tempF + '°F</div><div class="k">Temp</div></div>' +
        '<div class="cell"><div class="v">' + w.windMph + '</div><div class="k">Wind mph</div></div>' +
        '<div class="cell"><div class="v">' + w.precipMm + '</div><div class="k">Precip mm</div></div>' +
        '<div class="cell"><div class="v">' + dest.dist + '</div><div class="k">Miles</div></div></div>';
    }
    h += "</div>";
    if (state.lastEvent && state.legsDone > 0 && !weatherLoading) {
      /* lastEvent is shown on the mission screen; plan screen keeps the log instead */
    }
    if (state.companion) h += '<div class="card"><div class="wxnote">🧳 <b>' + state.companion.name + ' is riding this leg with you.</b> ' + benefitText(state.companion) + ' One limit: no bicycle with a passenger.</div></div>';
    h += '<div class="card"><h3>How will you travel?</h3>';
    let anyEnabled = false, anyEnergyBlock = false;
    TRANSPORTS.forEach(t => {
      const isBus = t.id === "bus";
      const noBus = isBus && !from.bus;
      const c = state.weather ? legCosts(t.id) : null;
      let sub = "", disabled = "", tag = "";
      if (t.id === "bike" && state.companion) { sub = state.companion.name + " can't ride along on a bicycle."; disabled = "disabled"; tag = "No room<span>for two</span>"; }
      else if (noBus) { sub = "No bus service runs from " + from.name + " on this route."; disabled = "disabled"; tag = "No service<span>from here</span>"; }
      else if (weatherLoading || !c) { sub = "Waiting on the weather check."; disabled = "disabled"; tag = "Checking<span>weather</span>"; }
      else {
        sub = c.notes.length ? c.notes.join(" ") : (t.id === "car" ? "Fast, and fuel is the cost." : t.id === "bike" ? "Nearly free, and the weather lands on you." : "Mid cost, mid effort, someone else drives.");
        tag = "$" + c.money + "<span>energy " + c.energy + " · morale " + fmtSigned(c.morale) + "</span>";
        if (c.money > state.money) { sub += " Not enough money."; disabled = "disabled"; }
        else if (c.energy >= state.energy) { sub += " That would leave you at zero energy."; disabled = "disabled"; }
      }
      if (!disabled) anyEnabled = true;
      if (c && c.energy >= state.energy) anyEnergyBlock = true;
      h += '<button class="choice act" data-action="travel-' + t.id + '" ' + disabled + '><span class="ic">' + t.icon + '</span><span class="tx">' + t.name + '<span class="sub">' + sub + '</span></span><span class="tag">' + tag + "</span></button>";
    });
    if (state.weather && !anyEnabled && anyEnergyBlock) {
      /* Safety net (playtest finding, Oct 31, 2026): never strand the
         traveler in a menu. If every ride is blocked and energy is the
         reason, resting right here is always offered. */
      const restCost = petProfile() ? petProfile().restCost : 10;
      const restEnergy = petProfile() ? petProfile().restEnergy : 26;
      const canAfford = state.money - restCost > 0;
      h += '<p class="small" style="margin-top:10px">Too worn out for every ride out of ' + from.name + '. Rest here first, then choose.</p>' +
        '<button class="choice act" data-action="plan-rest" ' + (canAfford ? "" : "disabled") + '><span class="ic">🛏️</span><span class="tx">Rest here first<span class="sub">A real meal and a quiet ' + (state.pet ? "pet-friendly " : "") + 'room in ' + from.name + ', before you travel.' + (canAfford ? "" : " Not enough money to rest.") + '</span></span><span class="tag">Energy +' + restEnergy + '<span>$' + restCost + ' · morale +6</span></span></button>';
    }
    h += '<div class="rowbtns"><button class="plain" data-action="sound">' + (settings.soundOn ? "Sound: on" : "Sound: off") + '</button>' +
      '<button class="plain" data-action="ov-settings">⚙️ Settings</button>' +
      '<button class="plain" data-action="abandon">Abandon trip</button></div></div>';
  }
  if (state.phase !== "setup") h += albumHTML(state.routeId, true);
  if (state.log.length && state.phase !== "setup") {
    h += '<div class="card"><h3>Trip log</h3><ul class="log">' + state.log.map(l => "<li>" + l + "</li>").join("") + "</ul></div>";
  }
  app.innerHTML = h + overlayHTML();
}
document.getElementById("app").addEventListener("input", (e) => {
  if (e.target.id === "traveler-name") { draft.name = e.target.value; return; }
  if (e.target.id === "pet-name") { draft.petName = e.target.value; return; }
  if (e.target.id === "traveler-gender-custom") { draft.genderCustom = e.target.value; return; }
  if (e.target.id === "traveler-pronouns-custom") { draft.pronounsCustom = e.target.value; return; }
  const key = e.target.getAttribute && e.target.getAttribute("data-setting");
  if (!key || !(key in settings)) return;
  settings[key] = parseInt(e.target.value, 10) || 0;
  saveSettings(); applyVolumes();
  const pct = document.getElementById("pct-" + key);
  if (pct) pct.textContent = settings[key] + "%";
});
document.getElementById("app").addEventListener("click", (e) => {
  const pickEl = e.target.closest("[data-petpick]");
  if (pickEl) {
    const val = pickEl.getAttribute("data-petpick");
    if (draft.pet !== val) {
      draft.pet = val;
      if (val === "dog" || val === "cat") {
        if (draft.petNameFor !== val) { draft.petName = (settings.petNames && settings.petNames[val]) || rollPetName(val); draft.petNameFor = val; }
      }
    }
    playSfx("tap");
    render();
    return;
  }
  const chipEl = e.target.closest("[data-chip]");
  if (chipEl) {
    const kind = chipEl.getAttribute("data-chip");
    draft[kind] = chipEl.getAttribute("data-value");
    playSfx("tap");
    render();
    return;
  }
  const btn = e.target.closest("[data-action]");
  if (!btn || btn.disabled) return;
  const a = btn.getAttribute("data-action");
  ensureAudioSession();
  if (a === "new-run") { localStorage.removeItem(SAVE_KEY); newRun(btn.getAttribute("data-route") || (state && state.routeId) || "bb", { dir: btn.getAttribute("data-dir") || "n" }); }
  else if (a === "continue-chain") { const nx = chainNextFor(state); if (nx) newRun(nx.route, { dir: nx.dir, carry: { traveler: state.traveler, pet: state.pet, petName: state.petName } }); }
  else if (a === "continue-run") { state = load(); render(); ensureWeather(); }
  else if (a === "sound") { settings.soundOn = !settings.soundOn; saveSettings(); applyVolumes(); if (settings.soundOn) { sndTap(); startMusic(); } else stopMusic(); render(); }
  else if (a === "music-toggle") { settings.musicOn = !settings.musicOn; saveSettings(); if (settings.musicOn) { startMusic(); } else stopMusic(); render(); }
  else if (a === "abandon") { state = null; try { localStorage.removeItem(SAVE_KEY); } catch (err) {} render(); }
  else if (a === "travel-car") chooseTransport("car");
  else if (a === "travel-bike") chooseTransport("bike");
  else if (a === "travel-bus") chooseTransport("bus");
  else if (a === "reroll-pet-name") { if (draft.pet === "dog" || draft.pet === "cat") { draft.petName = rollPetName(draft.pet, draft.petName); playSfx("tap"); render(); } }
  else if (a === "start-trip") {
    const hasPet = draft.pet === "dog" || draft.pet === "cat";
    const tName = (draft.name || "").trim();
    const pName = hasPet ? ((draft.petName || "").trim() || rollPetName(draft.pet)) : "";
    if (nameBlocked(tName) || nameBlocked(pName)) {
      state.setupError = "That name is not a fit for this trip. Try another?";
      if (nameBlocked(pName)) draft.petName = rollPetName(draft.pet);
      if (nameBlocked(tName)) draft.name = "";
      playSfx("bad");
      save(); render();
      return;
    }
    state.setupError = null;
    commitIdentity();
    state.pet = hasPet ? draft.pet : null;
    state.petName = hasPet ? pName : null;
    if (hasPet) { settings.petNames[draft.pet] = pName; saveSettings(); }
    state.phase = "plan";
    playSfx(hasPet ? "visit" : "tap");
    save(); render(); ensureWeather();
  }
  else if (a === "friend-befriend") resolveEncounter(true);
  else if (a === "friend-leave") resolveEncounter(false);
  else if (a === "mission-companion") chooseMission("companion");
  else if (a === "mission-job") chooseMission("job");
  else if (a === "mission-visit") chooseMission("visit");
  else if (a === "mission-rest") chooseMission("rest");
  else if (a === "mission-continue") chooseMission("continue");
  else if (a === "plan-rest") planRest();
  else if (a === "ov-map") { overlay = "map"; render(); }
  else if (a === "ov-album") { overlay = "album"; overlayRoute = (state && state.routeId) || "bb"; render(); }
  else if (a === "ov-settings") { overlay = "settings"; render(); }
  else if (a === "ov-album-route") { overlayRoute = btn.getAttribute("data-route") || "bb"; render(); }
  else if (a === "ov-panel") { /* clicks inside a layer stay in the layer */ }
  else if (a === "ov-close") { overlay = null; render(); }
});
const existing = load();
if (existing && existing.phase !== "over") { state = existing; }
render();
if (state && state.phase === "plan") ensureWeather();
window.__RR = { getState: () => state, getAlbum: () => album, getSettings: () => settings, getDraft: () => draft, audio: __RR_AUDIO, newRun, chooseTransport, chooseMission, resolveEncounter, costsFor, legCosts, companionFor, encounterFor, CRITTERS, nameBlocked, rollPetName, PET_NAME_POOLS, hashNum, seededWeather, travelEvent, get TOWNS(){ return TOWNS; }, ROUTES, townsFor, SAVE_KEY, ALBUM_KEY, SETTINGS_KEY,
  setState: (s) => { state = s; save(); render(); } };
</script>
